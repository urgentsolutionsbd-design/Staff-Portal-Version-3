<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#08111f"
  >

  <title>Staff Performance Portal V3</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >
</head>

<body class="login-page">

  <main class="login-container">

    <section class="login-brand">

      <div class="brand-icon">
        SP
      </div>

      <p class="eyebrow">
        Operations Portal
      </p>

      <h1>
        Staff Performance Portal
      </h1>

      <p class="version">
        Version 3
      </p>

      <p class="brand-description">
        Attendance, schedules, performance,
        KPI tracking and staff operations
        in one secure portal.
      </p>

    </section>


    <section class="login-card">

      <div class="login-tabs">

        <button
          id="staffTab"
          class="login-tab active"
          type="button"
        >
          Staff
        </button>

        <button
          id="adminTab"
          class="login-tab"
          type="button"
        >
          Admin
        </button>

      </div>


      <div class="login-heading">

        <p class="eyebrow">
          Secure Access
        </p>

        <h2 id="loginTitle">
          Staff Login
        </h2>

        <p id="loginDescription">
          Enter your Staff ID or email to continue.
        </p>

      </div>


      <form id="loginForm">

        <label class="form-field">

          <span>
            Staff ID or Email
          </span>

          <input
            id="identity"
            name="identity"
            type="text"
            placeholder="Enter Staff ID or email"
            autocomplete="username"
            required
          >

        </label>


        <label
          id="passwordField"
          class="form-field hidden"
        >

          <span>
            Password
          </span>

          <input
            id="password"
            name="password"
            type="password"
            placeholder="Enter password"
            autocomplete="current-password"
          >

        </label>


        <label class="remember-row">

          <input
            id="rememberMe"
            type="checkbox"
          >

          <span>
            Remember me
          </span>

        </label>


        <button
          id="loginButton"
          class="login-button"
          type="submit"
        >
          Sign In
        </button>


        <div
          id="loginMessage"
          class="login-message"
          hidden
        ></div>

      </form>

    </section>

  </main>


  <footer class="login-footer">
    Staff Performance Portal V3
  </footer>


  <script src="js/app.js"></script>

</body>
</html>
